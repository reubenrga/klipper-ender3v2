[gcode_shell_command get_spool_weight]
command: /home/reuben/printer_data/config/scripts/get_spool_weight.sh
timeout: 5.0
verbose: True

[gcode_macro GET_SPOOL_WEIGHT]
description: Checks current Spoolman spool weight and aborts if below FILAMENT_WEIGHT
gcode:
    {% set req_weight = params.FILAMENT_WEIGHT|default(0)|float %}
    RUN_SHELL_COMMAND CMD=get_spool_weight PARAMS="{req_weight}"

[gcode_macro _CHECK_SPOOL]
gcode:
    {% set req = params.FILAMENT_WEIGHT|default(0)|float %}
    {% set rem = printer.save_variables.variables.spool_weight|default(-1)|float %}
    {% if rem < 0 %}
      { action_raise_error("Print aborted: No active Spoolman spool selected.") }
    {% elif req > 0 and rem < req %}
      { action_raise_error("Print aborted: Not enough filament (need %.1fg, %.1fg remaining)." % (req, rem)) }
    {% endif %}

[gcode_macro START_PRINT]
gcode:
   # Filament weight check
  {% set req_weight = params.FILAMENT_WEIGHT|default(0)|float %}
  GET_SPOOL_WEIGHT
  _CHECK_SPOOL FILAMENT_WEIGHT={req_weight}

  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(230)|float %}

  # Heat bed first and home axes
  M140 S{BED_TEMP}        # Start heating bed
  M104 S150               # Preheat nozzle to 150C (prevents oozing)
  M190 S{BED_TEMP}        # Wait for bed to reach target temperature
  G90					  #
  G28                     # Home all axes on a warm, expanded bed

  # Load bed mesh before final nozzle heat
  #BED_MESH_PROFILE LOAD="default"
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Move to safe start/purge area and heat nozzle
  G1 Z10 F3000
  G1 X5 Y10 Z0.28 F5000.0
  M109 S{EXTRUDER_TEMP}

  # Prime line
  G92 E0
  G1 X5 Y150 E15 F1500.0
  G92 E0
  G1 Z2.0 F3000

[gcode_macro END_PRINT]
gcode:
  # Retract slightly and lift nozzle away from print
  G91
  G1 E-2 F2700
  G1 Z10 F3000
  G90

  # Park toolhead and present bed
  G1 X0 Y220 F5000

  # Turn off heaters, fans, and steppers
  TURN_OFF_HEATERS
  M107
  M84
